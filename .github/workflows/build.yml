name: Build Alaric Secure Browser

on:
  push:
    branches: [main]
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build-windows:
    name: Windows Installer (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate app icon
        run: node scripts/gen-icon.js

      - name: Build Windows installer
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Rename for clean download URL
        shell: bash
        run: |
          mv "dist/Alaric Secure Browser Setup 1.0.0.exe" "dist/AlaricSecureBrowser-Windows-x64.exe"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alaric-Secure-Browser-Windows-x64
          path: dist/AlaricSecureBrowser-Windows-x64.exe
          retention-days: 30

  build-mac:
    name: macOS DMG (x64 + arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate app icon
        run: node scripts/gen-icon.js

      - name: Build macOS x64 DMG
        run: npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build macOS arm64 DMG
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Rename for clean download URLs
        run: |
          mv "dist/Alaric Secure Browser-1.0.0.dmg"      "dist/AlaricSecureBrowser-macOS-x64.dmg"
          mv "dist/Alaric Secure Browser-1.0.0-arm64.dmg" "dist/AlaricSecureBrowser-macOS-arm64.dmg"

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Alaric-Secure-Browser-macOS
          path: dist/AlaricSecureBrowser-macOS-*.dmg
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Alaric-Secure-Browser-Windows-x64
          path: release-assets/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: Alaric-Secure-Browser-macOS
          path: release-assets/

      - name: List assets
        run: ls -lh release-assets/

      - name: Publish release (tag = latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Alaric Secure Browser — Latest Build"
          body: |
            ## Download

            | Platform | File |
            |---|---|
            | **Windows 10/11 (64-bit)** | `AlaricSecureBrowser-Windows-x64.exe` |
            | **macOS — Apple Silicon (M1/M2/M3)** | `AlaricSecureBrowser-macOS-arm64.dmg` |
            | **macOS — Intel** | `AlaricSecureBrowser-macOS-x64.dmg` |

            ### Installation notes
            - **Windows**: Run the `.exe` as Administrator
            - **macOS**: Drag to Applications. If Gatekeeper blocks it → System Settings → Privacy & Security → Open Anyway
          files: release-assets/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

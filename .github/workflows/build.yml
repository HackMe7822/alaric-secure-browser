name: Build Alaric Secure Browser

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── Set version once, shared by all jobs via output ───────────────────────
  version:
    name: Set version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: echo "version=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

  # ─── Windows build ──────────────────────────────────────────────────────────
  build-windows:
    name: Windows Installer (x64)
    needs: version
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Stamp version into package.json
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p  = JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version = '${{ env.APP_VERSION }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Generate app icon
        run: node scripts/gen-icon.js

      - name: Build Windows installer + update metadata
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Rename installer for clean download URL
        shell: bash
        run: |
          mv "dist/Alaric Secure Browser Setup ${{ env.APP_VERSION }}.exe" \
             "dist/AlaricSecureBrowser-Windows-x64.exe"

      - name: Fix latest.yml to reference renamed installer
        # electron-updater downloads the file named in latest.yml — must match the release asset name
        shell: bash
        run: |
          python3 -c "
          import re
          with open('dist/latest.yml') as f: c = f.read()
          c = re.sub(r'url: .*\.exe', 'url: AlaricSecureBrowser-Windows-x64.exe', c)
          c = re.sub(r'path: .*\.exe', 'path: AlaricSecureBrowser-Windows-x64.exe', c)
          with open('dist/latest.yml', 'w') as f: f.write(c)
          print(open('dist/latest.yml').read())
          "

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: dist/AlaricSecureBrowser-Windows-x64.exe
          retention-days: 30

      - name: Upload Windows update metadata (latest.yml)
        uses: actions/upload-artifact@v4
        with:
          name: win-update-meta
          path: dist/latest.yml
          retention-days: 30

  # ─── macOS build ────────────────────────────────────────────────────────────
  build-mac:
    name: macOS DMG + ZIP (x64 + arm64)
    needs: version
    runs-on: macos-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Stamp version into package.json
        run: |
          node -e "
            const fs = require('fs');
            const p  = JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version = '${{ env.APP_VERSION }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Generate app icon
        run: node scripts/gen-icon.js

      - name: Build macOS x64 (DMG + ZIP)
        run: npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build macOS arm64 (DMG + ZIP)
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Rename DMGs for clean download URLs
        run: |
          mv "dist/Alaric Secure Browser-${{ env.APP_VERSION }}.dmg"       dist/AlaricSecureBrowser-macOS-x64.dmg   2>/dev/null || true
          mv "dist/Alaric Secure Browser-${{ env.APP_VERSION }}-arm64.dmg" dist/AlaricSecureBrowser-macOS-arm64.dmg 2>/dev/null || true

      - name: Upload macOS DMGs
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist/AlaricSecureBrowser-macOS-*.dmg
          retention-days: 30

      - name: Upload macOS update metadata (latest-mac.yml) and ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: mac-update-meta
          path: |
            dist/latest-mac.yml
            dist/*.zip
            dist/*.zip.blockmap
          retention-days: 30

  # ─── Publish GitHub Release ─────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [version, build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: win-installer
          path: release-assets/

      - name: Download Windows update metadata
        uses: actions/download-artifact@v4
        with:
          name: win-update-meta
          path: release-assets/

      - name: Download macOS DMGs
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: release-assets/

      - name: Download macOS update metadata + ZIPs
        uses: actions/download-artifact@v4
        with:
          name: mac-update-meta
          path: release-assets/

      - name: List release assets
        run: ls -lh release-assets/

      - name: Publish versioned release (auto-update target)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: "Alaric Secure Browser v${{ needs.version.outputs.version }}"
          body: |
            ## Alaric Secure Browser v${{ needs.version.outputs.version }}

            Built from commit ${{ github.sha }} — auto-deployed by CI.

            ### Download

            | Platform | File |
            |---|---|
            | **Windows 10/11 (64-bit)** | `AlaricSecureBrowser-Windows-x64.exe` |
            | **macOS — Apple Silicon (M1/M2/M3)** | `AlaricSecureBrowser-macOS-arm64.dmg` |
            | **macOS — Intel** | `AlaricSecureBrowser-macOS-x64.dmg` |

            > **Auto-update**: Installed copies of the app update silently on next launch via `latest.yml` / `latest-mac.yml`.

            ### Installation notes
            - **Windows**: Run the `.exe` as Administrator (one-click silent install)
            - **macOS**: Drag to Applications. If Gatekeeper blocks it → System Settings → Privacy & Security → Open Anyway
          files: release-assets/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
